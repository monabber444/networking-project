apiVersion: v1
kind: Namespace
metadata:
  name: pulsemesh
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pulsemesh
  namespace: pulsemesh
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: pulsemesh
  namespace: pulsemesh
  labels:
    app.kubernetes.io/name: pulsemesh
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: pulsemesh
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pulsemesh
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: pulsemesh
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: pulsemesh
          image: ghcr.io/youruser/pulsemesh:latest
          imagePullPolicy: IfNotPresent
          args:
            - "--node-name=$(NODE_NAME)"
            - "--bind-addr=0.0.0.0"
            - "--gossip-port=7946"
            - "--probe-port=9000"
            - "--http-port=8080"
            - "--join=pulsemesh-headless.pulsemesh.svc.cluster.local:7946"
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: gossip-tcp
              containerPort: 7946
              protocol: TCP
            - name: gossip-udp
              containerPort: 7946
              protocol: UDP
            - name: probe-udp
              containerPort: 9000
              protocol: UDP
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
          readinessProbe:
            httpGet:
              path: /api/topology
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/topology
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            limits:
              cpu: 250m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: pulsemesh-headless
  namespace: pulsemesh
  labels:
    app.kubernetes.io/name: pulsemesh
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: gossip-tcp
      port: 7946
      protocol: TCP
    - name: gossip-udp
      port: 7946
      protocol: UDP
  selector:
    app.kubernetes.io/name: pulsemesh
---
apiVersion: v1
kind: Service
metadata:
  name: pulsemesh-ui
  namespace: pulsemesh
  labels:
    app.kubernetes.io/name: pulsemesh
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  selector:
    app.kubernetes.io/name: pulsemesh
