# ============================================================
# PulseMesh — 5-Node Docker Compose Cluster
# Launch:  docker compose -f deploy/docker-compose.yml up --build -d
# Dashboard: http://localhost:8080
# ============================================================

services:
  node-1:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: pulsemesh-node-1
    hostname: node-1
    command:
      - --node-name=node-1
      - --bind-addr=0.0.0.0
      - --gossip-port=7946
      - --probe-port=9000
      - --http-port=8080
    cap_add:
      - NET_ADMIN
      - NET_RAW
    ports:
      - "8080:8080"
    networks:
      pulsemesh-net:
        ipv4_address: 10.10.0.11
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/topology"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  node-2:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: pulsemesh-node-2
    hostname: node-2
    command:
      - --node-name=node-2
      - --bind-addr=0.0.0.0
      - --gossip-port=7946
      - --probe-port=9000
      - --http-port=8080
      - --join=node-1:7946
    cap_add:
      - NET_ADMIN
      - NET_RAW
    ports:
      - "8081:8080"
    networks:
      pulsemesh-net:
        ipv4_address: 10.10.0.12
    depends_on:
      node-1:
        condition: service_healthy

  node-3:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: pulsemesh-node-3
    hostname: node-3
    command:
      - --node-name=node-3
      - --bind-addr=0.0.0.0
      - --gossip-port=7946
      - --probe-port=9000
      - --http-port=8080
      - --join=node-1:7946
    cap_add:
      - NET_ADMIN
      - NET_RAW
    ports:
      - "8082:8080"
    networks:
      pulsemesh-net:
        ipv4_address: 10.10.0.13
    depends_on:
      node-1:
        condition: service_healthy

  node-4:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: pulsemesh-node-4
    hostname: node-4
    command:
      - --node-name=node-4
      - --bind-addr=0.0.0.0
      - --gossip-port=7946
      - --probe-port=9000
      - --http-port=8080
      - --join=node-1:7946
    cap_add:
      - NET_ADMIN
      - NET_RAW
    ports:
      - "8083:8080"
    networks:
      pulsemesh-net:
        ipv4_address: 10.10.0.14
    depends_on:
      node-1:
        condition: service_healthy

  node-5:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: pulsemesh-node-5
    hostname: node-5
    command:
      - --node-name=node-5
      - --bind-addr=0.0.0.0
      - --gossip-port=7946
      - --probe-port=9000
      - --http-port=8080
      - --join=node-1:7946
    cap_add:
      - NET_ADMIN
      - NET_RAW
    ports:
      - "8084:8080"
    networks:
      pulsemesh-net:
        ipv4_address: 10.10.0.15
    depends_on:
      node-1:
        condition: service_healthy

networks:
  pulsemesh-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.0.0/24
