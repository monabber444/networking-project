name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-backend:
    name: Backend Tests & Race Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Verify dependencies
        run: go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Run unit & integration tests with race detector
        run: go test -v -race -count=1 ./...

  test-frontend:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Typecheck and build UI
        working-directory: web
        run: npm run build

  build-binary:
    name: Full Static Binary Build
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Web UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Compile PulseMesh Binary
        run: |
          CGO_ENABLED=0 go build -ldflags="-s -w" -o bin/pulsemesh ./cmd/pulsemesh
          ./bin/pulsemesh --help || true

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pulsemesh-linux-amd64
          path: bin/pulsemesh
